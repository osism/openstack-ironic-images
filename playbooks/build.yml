---
- name: Build image
  hosts: all

  vars:
    _dib_element: "{{ dib_element | default('burnin') }}"
    _image_format: "{{ image_format | default('raw') }}"

  tasks:
    - name: Check registry.tar.bz2 timestamp for metalbox image
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -e

          MAX_ATTEMPTS=12
          WAIT_SECONDS=300
          URL="https://nbg1.your-objectstorage.com/osism/metalbox/registry.tar.bz2"

          for attempt in $(seq 1 $MAX_ATTEMPTS); do
            echo "Attempt $attempt of $MAX_ATTEMPTS: Checking Last-Modified header..."

            # Keep the whole response, not just the header: when the header
            # is missing, the status line, the other headers and curl's stderr
            # are the only record of why. Do not add -f -- it discards exactly
            # that record on an HTTP error.
            HEAD_OUT=$(curl -sS --retry 3 --retry-delay 5 \
              -I -w 'http_code=%{http_code}\n' "$URL" 2>&1 || true)

            # Read the header out of the FINAL response block only.
            # --retry can leave several blocks in HEAD_OUT, and the answer must
            # come from the response curl settled on -- not merely the last
            # header present anywhere. Those differ when an earlier block
            # carries Last-Modified and the final one does not: taking the
            # earlier value would report a fresh mirror on the strength of a
            # response that failed, and build against an unverified archive.
            # Each status line therefore clears the candidate, so what survives
            # to END belongs to the final block, or is empty.
            #
            # Collapsing the value to one line also matters: date -d rejects a
            # multiline argument, and under set -e that would kill the task and
            # every remaining attempt with it.
            LAST_MODIFIED=$(printf '%s\n' "$HEAD_OUT" | tr -d '\r' | awk '
              /^[Hh][Tt][Tt][Pp]\// { candidate = ""; next }
              {
                if (tolower($0) ~ /^last-modified:/) {
                  candidate = substr($0, index($0, ":") + 1)
                  sub(/^[ \t]+/, "", candidate)
                }
              }
              END { print candidate }' || true)

            # Parsed tolerantly for the same reason: an unparseable date is a
            # reason to poll again, not to abandon the wait.
            FILE_DATE=""
            if [ -n "$LAST_MODIFIED" ]; then
              echo "Last-Modified: $LAST_MODIFIED"

              # Last-Modified format: "Day, DD Mon YYYY HH:MM:SS GMT"
              FILE_DATE=$(date -d "$LAST_MODIFIED" +%Y-%m-%d 2>/dev/null || true)
            fi
            TODAY=$(date +%Y-%m-%d)

            if [ -n "$FILE_DATE" ]; then
              echo "File date: $FILE_DATE"
              echo "Today's date: $TODAY"

              if [ "$FILE_DATE" = "$TODAY" ]; then
                echo "SUCCESS: File was modified today. Proceeding with build."
                exit 0
              fi

              echo "File was not modified today."
            elif [ -n "$LAST_MODIFIED" ]; then
              echo "Last-Modified could not be parsed as a date."
            else
              echo "Last-Modified header unavailable. curl reported:"
              printf '%s\n' "$HEAD_OUT" | sed 's/^/  /'
            fi

            if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
              echo "Waiting $WAIT_SECONDS seconds before retry..."
              sleep "$WAIT_SECONDS"
            else
              echo "ERROR: After $MAX_ATTEMPTS attempts, $URL was still not modified today."
              exit 1
            fi
          done
      when: _dib_element == 'metalbox'
      changed_when: false

    - name: Run build script
      ansible.builtin.shell:
        executable: /bin/bash
        chdir: "{{ zuul.project.src_dir }}"
        cmd: |
          set -e
          set -x

          export PATH=/home/zuul/.local/bin:$PATH
          export ELEMENTS_PATH=./elements
          export DIB_RELEASE=noble

          source files/{{ _dib_element }}.sh
          source /tmp/venv/bin/activate

          disk-image-create \
            -a amd64 \
            -t {{ _image_format }} \
            -o osism-{{ _dib_element }}-image.{{ _image_format }} \
            --image-size $IMAGE_SIZE \
            vm block-device-efi ubuntu bootloader cloud-init $IMAGE_ELEMENTS {{ _dib_element }}

      changed_when: true

    - name: Run upload script
      ansible.builtin.shell:  # noqa command-instead-of-module
        executable: /bin/bash
        chdir: "{{ zuul.project.src_dir }}"
        cmd: |
          sha256sum osism-{{ _dib_element }}-image.{{ _image_format }} osism-{{ _dib_element }}-image.{{ _image_format }}.CHECKSUM

          if [[ "{{ _image_format }}" == "raw" ]]; then
              zip osism-{{ _dib_element }}-image.zip osism-{{ _dib_element }}-image.{{ _image_format }} osism-{{ _dib_element }}-image.{{ _image_format }}.CHECKSUM
              rclone copyto osism-{{ _dib_element }}-image.zip s3:osism/openstack-ironic-images/osism-{{ _dib_element }}-image.zip
          else
              rclone copyto osism-{{ _dib_element }}-image.{{ _image_format }}.CHECKSUM s3:osism/openstack-ironic-images/osism-{{ _dib_element }}-image.{{ _image_format }}.CHECKSUM
              rclone copyto osism-{{ _dib_element }}-image.{{ _image_format }} s3:osism/openstack-ironic-images/osism-{{ _dib_element }}-image.{{ _image_format }}
          fi

      environment:
        RCLONE_CONFIG_S3_TYPE: s3
        RCLONE_CONFIG_S3_PROVIDER: Ceph
        RCLONE_CONFIG_S3_ENDPOINT: https://nbg1.your-objectstorage.com
        RCLONE_CONFIG_S3_REGION: nbg1
        RCLONE_CONFIG_S3_ACCESS_KEY_ID: "{{ secret.ACCESS_KEY | trim }}"
        RCLONE_CONFIG_S3_SECRET_ACCESS_KEY: "{{ secret.SECRET_KEY | trim }}"
        RCLONE_CONFIG_S3_ACL: public-read
        RCLONE_CONFIG_S3_NO_CHECK_BUCKET: "true"
      when: upload_image | bool
      no_log: true
      changed_when: true
